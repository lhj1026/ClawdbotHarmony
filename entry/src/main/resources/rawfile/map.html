<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  #map{width:100%;height:100%}
  .dot-label{
    font-size:12px;font-weight:bold;white-space:nowrap;
    background:rgba(255,255,255,0.92);padding:3px 8px;
    border-radius:10px;border:1px solid #ddd;
    box-shadow:0 1px 4px rgba(0,0,0,0.15);
    line-height:1.4;
  }
  .dot-label .time{color:#999;font-size:10px;font-weight:normal}
  .empty-msg{
    display:flex;align-items:center;justify-content:center;
    height:100%;font-size:16px;color:#999;font-family:sans-serif;
  }
</style>
</head>
<body>
<div id="map"></div>
<script>
var map=null;
var layerGroup=null;

function renderMap(points,lines){
  if(!points||points.length===0){
    document.getElementById('map').innerHTML='<div class="empty-msg">No GPS data</div>';
    return;
  }
  if(!map){
    map=L.map('map',{zoomControl:false,attributionControl:false});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
    layerGroup=L.layerGroup().addTo(map);
  }else{
    layerGroup.clearLayers();
  }
  var bounds=[];
  // Draw route lines
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    var opts={color:ln.color,weight:4,opacity:0.8};
    if(ln.dash)opts.dashArray='8,6';
    L.polyline([ln.from,ln.to],opts).addTo(layerGroup);
  }
  // Draw markers
  for(var i=0;i<points.length;i++){
    var p=points[i];
    bounds.push([p.lat,p.lng]);
    L.circleMarker([p.lat,p.lng],{
      radius:8,fillColor:'#fff',color:p.color,weight:3,fillOpacity:1
    }).addTo(layerGroup);
    var div=L.divIcon({
      className:'',
      html:'<div class="dot-label">'+p.label+'<br><span class="time">'+p.time+'</span></div>',
      iconSize:[0,0],iconAnchor:[-12,8]
    });
    L.marker([p.lat,p.lng],{icon:div}).addTo(layerGroup);
  }
  if(bounds.length>1){
    map.fitBounds(bounds,{padding:[50,50]});
  }else if(bounds.length===1){
    map.setView(bounds[0],15);
  }
}
</script>
</body>
</html>
